<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Научные статьи — Ситковский А.М.</title>
  <meta name="description" content="Список научных публикаций Арсения Михайловича Ситковского по данным eLibrary/РИНЦ, Scopus, Web of Science, ORCID, OpenAlex и Crossref.">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/additions.css">
  <link rel="stylesheet" href="assets/scientometrics.css">
  <script defer src="assets/site.js"></script>
  <script defer src="assets/publications.js"></script>
</head>
<body>
<div class="wrap">
  <header data-header></header>
  <section class="hero">
    <h1 class="ru">Научные статьи</h1>
    <h1 class="en">Research articles</h1>
  </section>
  <section class="card" style="margin-top:16px">
    <div id="scientometrics"></div>
    <div class="pubtools">
      <input id="q" class="input" placeholder="Поиск по названию, автору, журналу, DOI / Search...">
      <select id="year" class="input" style="max-width:220px"></select>
      <select id="src" class="input" style="max-width:220px">
        <option id="src-all" value="">Все источники</option>
        <option value="elibrary">eLibrary</option>
        <option value="scopus">Scopus</option>
        <option value="wos">Web of Science</option>
      </select>
      <span class="chip"><span class="ru">Найдено</span><span class="en">Found</span>: <b id="count">0</b></span>
    </div>
    <div id="pubs"></div>
  </section>
  <footer class="footer"><span>Источники: eLibrary/RINC snapshot, Scopus API snapshot, Web of Science Researcher Profile, ORCID/OpenAlex/Crossref, журналоведческий справочник SCOPUS/WOS/RSCI/РЦНИ.</span><br><span>omnistat@yandex.ru</span></footer>
</div>
</body>
</html>
