<svg font-family="Arial, Helvetica, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Static-first academic portfolio platform</title>
  <desc id="desc">A public website assembled from versioned data, automated harvesters and reusable research identity modules.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f4f4f2"/>
  <text x="56" y="72.0" font-size="34" font-weight="900" fill="#171717" text-anchor="start">Static-first academic portfolio platform</text>
  <text x="56" y="108.0" font-size="18" font-weight="400" fill="#55575c" text-anchor="start">A public website assembled from versioned data, automated harvesters and reusable research identity modules.</text>
  
    <rect x="56" y="170" width="260" height="380" rx="8" fill="#dcebf7" stroke="#bfc2c7" stroke-width="1.5"/>
    <text x="80" y="206.0" font-size="22" font-weight="800" fill="#171717" text-anchor="start">Source layer</text>
    <text x="80" y="240.0" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">ORCID, OpenAlex, Crossref</text>
<text x="80" y="261.6" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">eLibrary / RSCI</text>
<text x="80" y="283.2" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">Scopus and Web of Science</text>
<text x="80" y="304.8" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">GitHub projects, media links</text>
<text x="80" y="326.4" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">PDF, JPEG, PNG credentials</text>
    
    <rect x="390" y="150" width="300" height="420" rx="8" fill="#fff1c7" stroke="#bfc2c7" stroke-width="1.5"/>
    <text x="414" y="186.0" font-size="22" font-weight="800" fill="#171717" text-anchor="start">Automation layer</text>
    <text x="414" y="220.0" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">GitHub Actions schedules</text>
<text x="414" y="241.6" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">Python harvesters and parsers</text>
<text x="414" y="263.2" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">best-effort fallbacks</text>
<text x="414" y="284.8" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">review queues</text>
<text x="414" y="306.4" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">static JSON builders</text>
    
    <rect x="764" y="170" width="260" height="380" rx="8" fill="#dff1e5" stroke="#bfc2c7" stroke-width="1.5"/>
    <text x="788" y="206.0" font-size="22" font-weight="800" fill="#171717" text-anchor="start">Public website</text>
    <text x="788" y="240.0" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">Profile and identifiers</text>
<text x="788" y="261.6" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">publications and metrics</text>
<text x="788" y="283.2" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">media cards</text>
<text x="788" y="304.8" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">diploma collage</text>
<text x="788" y="326.4" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">projects and teaching materials</text>
    
    <rect x="1052" y="260" width="190" height="190" rx="8" fill="#f5dfdf" stroke="#bfc2c7" stroke-width="1.5"/>
    <text x="1076" y="296.0" font-size="22" font-weight="800" fill="#171717" text-anchor="start">Governance</text>
    <text x="1076" y="330.0" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">audit stamps</text>
<text x="1076" y="351.6" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">Playwright QA</text>
<text x="1076" y="373.2" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">versioned data</text>
<text x="1076" y="394.8" font-size="16" font-weight="400" fill="#55575c" text-anchor="start">MIT + CC BY 4.0</text>
    <path d="M316 360 C 353.0 360, 353.0 360, 390 360" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/><path d="M690 360 C 727.0 360, 727.0 360, 764 360" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/><path d="M1024 360 C 1038.0 360, 1038.0 360, 1052 360" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/>
</svg>