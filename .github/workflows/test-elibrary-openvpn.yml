name: Test eLibrary OpenVPN

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/test-elibrary-openvpn.yml"
      - "scripts/harvest_elibrary_browser.py"
      - "scripts/test_elibrary_authors_route.py"
      - "scripts/harvest_elibrary_items.py"
      - "scripts/elibrary_fetch.py"

permissions:
  contents: read

jobs:
  test-openvpn:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenVPN and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn curl iproute2 xvfb
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Decode OpenVPN config from GitHub Secret
        env:
          ELIBRARY_OPENVPN_CONFIG_B64: ${{ secrets.ELIBRARY_OPENVPN_CONFIG_B64 }}
        run: |
          if [ -z "$ELIBRARY_OPENVPN_CONFIG_B64" ]; then
            echo "Secret ELIBRARY_OPENVPN_CONFIG_B64 is not set."
            exit 1
          fi
          umask 077
          printf '%s' "$ELIBRARY_OPENVPN_CONFIG_B64" | base64 --decode > elibrary-home.ovpn
          echo "OpenVPN config decoded. Remote line is redacted."
          sed -n 's/^remote .*/remote [redacted] [redacted]/p' elibrary-home.ovpn

      - name: Connect through home OpenVPN and test eLibrary routes
        shell: bash
        env:
          ELIBRARY_BROWSER_WAIT_SEC: "130"
          ELIBRARY_BROWSER_HEADLESS: "false"
          ELIBRARY_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 YaBrowser/26.4.0.0 Safari/537.36"
          ELIBRARY_COOKIE: ${{ secrets.ELIBRARY_COOKIE }}
          ELIBRARY_AUTHOR_ID: "1012909"
          ELIBRARY_ITEMS_URL: "https://elibrary.ru/author_items.asp?authorid=1012909&pubrole=100&show_refs=1&pubcat=risc"
          ELIBRARY_ITEMS_OUT: data/processed/elibrary_publications.json
          ELIBRARY_ITEMS_REPORT: data/elibrary/items_fetch_report.json
        run: |
          set +e
          rm -f data/processed/elibrary_publications.json data/elibrary/items_fetch_report.json data/elibrary/browser_fetch_report.json
          rm -rf artifacts/elibrary_debug
          IP_BEFORE=$(curl -fsS --max-time 20 https://api.ipify.org || true)
          echo "Public IP before VPN: ${IP_BEFORE:-not available}"

          sudo openvpn \
            --config elibrary-home.ovpn \
            --data-ciphers-fallback AES-128-CBC \
            --allow-compression yes \
            --daemon \
            --writepid openvpn.pid \
            --log openvpn.log

          echo "Waiting for tun0..."
          for i in $(seq 1 60); do
            if ip link show tun0 >/dev/null 2>&1; then
              echo "tun0 is up"
              break
            fi
            sleep 2
          done

          echo "Routes after VPN connection:"
          ip route || true

          IP_AFTER=$(curl -fsS --max-time 30 https://api.ipify.org || true)
          echo "Public IP after VPN: ${IP_AFTER:-not available}"

          PROBE_STATUS=0
          if [ -n "$ELIBRARY_COOKIE" ]; then
            echo "ELIBRARY_COOKIE is set; trying cookie-aware HTTP harvester first."
            python scripts/harvest_elibrary_items.py || true
          else
            echo "ELIBRARY_COOKIE is not set; skipping cookie-aware HTTP route."
          fi
          if [ ! -s data/processed/elibrary_publications.json ]; then
            echo "No publication JSON yet; trying browser authors-route in headed Chromium under Xvfb."
            xvfb-run -a python scripts/test_elibrary_authors_route.py || PROBE_STATUS=$?
          fi
          if [ -s data/processed/elibrary_publications.json ]; then
            RECORDS=$(python -c "import json, pathlib; p=pathlib.Path('data/processed/elibrary_publications.json'); data=json.loads(p.read_text(encoding='utf-8')); print(len(data) if isinstance(data, list) else 0)" 2>/dev/null || echo 0)
            echo "Publication-list JSON records: $RECORDS"
            if [ "$RECORDS" -ge 50 ]; then
              echo "Publication-list JSON was produced from this run; diagnostic is successful."
              PROBE_STATUS=0
            else
              echo "Publication-list JSON has too few records; diagnostic is not yet successful."
              PROBE_STATUS=2
            fi
          fi

          if [ -f openvpn.pid ]; then
            sudo kill "$(cat openvpn.pid)" 2>/dev/null || true
          fi

          echo "OpenVPN log tail:"
          sudo tail -n 160 openvpn.log || true

          if [ -z "$IP_AFTER" ] || [ "$IP_AFTER" = "$IP_BEFORE" ]; then
            echo "VPN did not change public IP. Check TP-Link Client Access: choose Internet and Home Network, and check port/DDNS/CG-NAT."
            exit 2
          fi
          if [ "$PROBE_STATUS" != "0" ]; then
            echo "Both eLibrary routes failed with status $PROBE_STATUS. See uploaded artifacts."
            exit "$PROBE_STATUS"
          fi
          exit 0

      - name: Upload eLibrary debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elibrary-openvpn-debug
          path: |
            data/elibrary/browser_fetch_report.json
            data/elibrary/items_fetch_report.json
            data/processed/elibrary_publications.json
            artifacts/elibrary_debug/**
            data/snapshots/elibrary/items/*_authors_route.html
          if-no-files-found: ignore
          retention-days: 7
