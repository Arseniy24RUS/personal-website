name: Refresh confirmed media corpus

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 1"

permissions:
  contents: write

jobs:
  refresh-media-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Apply confirmed media corpus
        run: |
          python scripts/apply_media_seed_overrides.py
      - name: Commit confirmed media data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/media/ data/admin_queue/ assets/media/mentions/ || true
          if git diff --cached --quiet; then
            echo "No media corpus changes."
          else
            git commit -m "chore: refresh confirmed media corpus"
            git push
          fi
