name: Build diplomas gallery

on:
  workflow_dispatch:
  push:
    paths:
      - 'content/diplomas/**'
      - 'scripts/build_diplomas_gallery.py'

permissions:
  contents: write

jobs:
  build-diplomas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pymupdf
      - name: Build diplomas gallery
        run: |
          python scripts/build_diplomas_gallery.py
      - name: Commit diplomas gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/diplomas/ data/diplomas/gallery.json || true
          if git diff --cached --quiet; then
            echo "No diplomas gallery changes."
          else
            git commit -m "chore: build diplomas gallery"
            git push
          fi
