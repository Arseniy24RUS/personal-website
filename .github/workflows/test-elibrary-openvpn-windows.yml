name: Test eLibrary OpenVPN Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/test-elibrary-openvpn-windows.yml"
      - "scripts/test_elibrary_har_route.py"
      - "scripts/harvest_elibrary_items.py"
      - "scripts/elibrary_fetch.py"
      - "scripts/parse_elibrary_author_items.py"

permissions:
  contents: read

jobs:
  test-openvpn-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenVPN and Python dependencies
        shell: pwsh
        run: |
          choco install openvpn -y --no-progress
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright
          python -m playwright install chromium
          if (Test-Path "$env:ProgramFiles\OpenVPN\bin\openvpn.exe") { & "$env:ProgramFiles\OpenVPN\bin\openvpn.exe" --version | Select-Object -First 2 }
          msedge --version 2>$null || Write-Host "msedge command is not on PATH; Playwright will still try channel=msedge."

      - name: Connect through home OpenVPN and test eLibrary on Windows client stack
        shell: pwsh
        env:
          ELIBRARY_OPENVPN_CONFIG_B64: ${{ secrets.ELIBRARY_OPENVPN_CONFIG_B64 }}
          ELIBRARY_COOKIE: ${{ secrets.ELIBRARY_COOKIE }}
          ELIBRARY_AUTHOR_ID: "1012909"
          ELIBRARY_BROWSER_WAIT_SEC: "130"
          ELIBRARY_BROWSER_HEADLESS: "true"
          ELIBRARY_BROWSER_CHANNEL: "msedge"
          ELIBRARY_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 YaBrowser/26.4.0.0 Safari/537.36"
          ELIBRARY_ITEMS_URL: "https://elibrary.ru/author_items.asp?authorid=1012909&pubrole=100&show_refs=1&pubcat=risc"
          ELIBRARY_ITEMS_OUT: data/processed/elibrary_publications.json
          ELIBRARY_ITEMS_REPORT: data/elibrary/items_fetch_report.json
        run: |
          New-Item -ItemType Directory -Force -Path data/processed, data/elibrary, artifacts/elibrary_debug | Out-Null
          Remove-Item -Force -ErrorAction SilentlyContinue data/processed/elibrary_publications.json, data/elibrary/items_fetch_report.json, data/elibrary/browser_fetch_report.json
          if (-not $env:ELIBRARY_OPENVPN_CONFIG_B64) { throw "Secret ELIBRARY_OPENVPN_CONFIG_B64 is not set." }
          [IO.File]::WriteAllBytes("elibrary-home.ovpn", [Convert]::FromBase64String($env:ELIBRARY_OPENVPN_CONFIG_B64))
          $ipBefore = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 20 https://api.ipify.org).Content.Trim()
          Write-Host "Public IP before VPN: $ipBefore"
          $openvpn = "$env:ProgramFiles\OpenVPN\bin\openvpn.exe"
          if (-not (Test-Path $openvpn)) { $openvpn = "$env:ProgramFiles\OpenVPN Connect\OpenVPNConnect.exe" }
          if (-not (Test-Path $openvpn)) { throw "OpenVPN executable was not found." }
          $proc = Start-Process -FilePath $openvpn -ArgumentList @("--config", (Resolve-Path "elibrary-home.ovpn"), "--log", (Join-Path (Get-Location) "openvpn.log")) -PassThru
          Start-Sleep -Seconds 35
          Get-NetIPConfiguration | Out-String | Write-Host
          try { $ipAfter = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 https://api.ipify.org).Content.Trim() } catch { $ipAfter = "" }
          Write-Host "Public IP after VPN: $ipAfter"
          $probeStatus = 0
          if ($env:ELIBRARY_COOKIE) {
            Write-Host "ELIBRARY_COOKIE is set; trying cookie-aware HTTP harvester first."
            python scripts/harvest_elibrary_items.py
          } else {
            Write-Host "ELIBRARY_COOKIE is not set; skipping cookie-aware HTTP route."
          }
          if (-not (Test-Path data/processed/elibrary_publications.json)) {
            Write-Host "No publication JSON yet; trying HAR-matched route with Windows Edge channel."
            python scripts/test_elibrary_har_route.py
            if ($LASTEXITCODE -ne 0) { $probeStatus = $LASTEXITCODE }
          }
          if (Test-Path data/processed/elibrary_publications.json) {
            $records = python -c "import json, pathlib; p=pathlib.Path('data/processed/elibrary_publications.json'); data=json.loads(p.read_text(encoding='utf-8')); print(len(data) if isinstance(data, list) else 0)"
            Write-Host "Publication-list JSON records: $records"
            if ([int]$records -ge 50) { $probeStatus = 0 } else { $probeStatus = 2 }
          }
          if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          if (Test-Path openvpn.log) { Get-Content openvpn.log -Tail 160 | Write-Host }
          if (-not $ipAfter -or $ipAfter -eq $ipBefore) { throw "VPN did not change public IP." }
          if ($probeStatus -ne 0) { throw "eLibrary Windows diagnostic failed with status $probeStatus." }

      - name: Upload eLibrary Windows debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elibrary-openvpn-windows-debug
          path: |
            data/elibrary/browser_fetch_report.json
            data/elibrary/items_fetch_report.json
            data/processed/elibrary_publications.json
            artifacts/elibrary_debug/**
            data/snapshots/elibrary/items/*_popup.html
          if-no-files-found: ignore
          retention-days: 7
