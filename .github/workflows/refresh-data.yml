name: Refresh scientist portfolio data

on:
  workflow_dispatch:
    inputs:
      scopus_author_id:
        description: "Optional Scopus Author ID override"
        required: false
        default: "57220956828"
        type: string
      mirror_craftum_assets:
        description: "Download/mirror Craftum assets into repository"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # Weekly refresh: every Monday at 03:17 UTC. This is more frequent than the minimum monthly requirement.
    - cron: "17 3 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyyaml rapidfuzz
      - name: Mirror Craftum assets
        run: |
          if [ "${{ inputs.mirror_craftum_assets || 'true' }}" = "true" ] && [ -f scripts/mirror_craftum_assets.py ]; then
            python scripts/mirror_craftum_assets.py || true
          else
            echo "Craftum asset mirroring skipped."
          fi
      - name: Harvest open bibliographic sources
        env:
          PROFILE_YAML: config/profile.yml
          OPENALEX_MAILTO: omnistat@yandex.ru
        run: |
          if [ -f scripts/harvest_open_sources.py ]; then
            python scripts/harvest_open_sources.py || true
          else
            echo "Open sources harvester is missing; skipping ORCID/OpenAlex/Crossref."
          fi
      - name: Harvest free media mentions
        env:
          PROFILE_YAML: config/profile.yml
        run: |
          if [ -f scripts/harvest_media_mentions.py ]; then
            python scripts/harvest_media_mentions.py || true
          else
            echo "Media mentions harvester is missing; skipping RSS media search."
          fi
      - name: Enhance media mention metadata and institutional scan
        env:
          PROFILE_YAML: config/profile.yml
          MEDIA_SOURCES_YAML: config/media_sources.yml
        run: |
          if [ -f scripts/enhance_media_mentions.py ]; then
            python scripts/enhance_media_mentions.py || true
          else
            echo "Media enhancer is missing; skipping metadata repair and institutional scan."
          fi
      - name: Normalize append-only media snapshot
        run: |
          if [ -f scripts/normalize_media_snapshot.py ]; then
            python scripts/normalize_media_snapshot.py --normalize-only || true
          else
            echo "Media snapshot normalizer is missing; skipping post-processing."
          fi
      - name: Harvest eLibrary author profile metrics
        env:
          ELIBRARY_AUTHOR_ID: "1012909"
          ELIBRARY_PROFILE_URL: "https://www.elibrary.ru/author_profile.asp?id=1012909"
          ELIBRARY_PROFILE_OUT: data/elibrary/profile_metrics.json
          ELIBRARY_PROFILE_REPORT: data/elibrary/profile_metrics_fetch_report.json
          ELIBRARY_PROXY_URL: ${{ secrets.ELIBRARY_PROXY_URL }}
        run: |
          if [ -f scripts/harvest_elibrary_profile.py ] && [ -f scripts/parse_elibrary_author_profile.py ]; then
            python scripts/harvest_elibrary_profile.py
          else
            echo "eLibrary author profile harvester/parser is missing; using existing normalized metrics."
          fi
      - name: Harvest eLibrary publication list
        env:
          ELIBRARY_AUTHOR_ID: "1012909"
          ELIBRARY_ITEMS_URL: "https://www.elibrary.ru/author_items.asp?authorid=1012909&pubrole=100&show_refs=1&pubcat=risc"
          ELIBRARY_ITEMS_OUT: data/processed/elibrary_publications.json
          ELIBRARY_ITEMS_REPORT: data/elibrary/items_fetch_report.json
          ELIBRARY_PROXY_URL: ${{ secrets.ELIBRARY_PROXY_URL }}
        run: |
          if [ -f scripts/harvest_elibrary_items.py ] && [ -f scripts/parse_elibrary_author_items.py ]; then
            python scripts/harvest_elibrary_items.py
          else
            echo "eLibrary items harvester/parser is missing; using existing data/elibrary/publications.tsv."
          fi
      - name: Harvest Scopus
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INST_TOKEN: ${{ secrets.SCOPUS_INST_TOKEN }}
          SCOPUS_AUTHOR_ID: ${{ inputs.scopus_author_id || '57220956828' }}
          SCOPUS_OUT_DIR: data/scopus
        run: |
          if [ -f scripts/harvest_scopus.py ] && [ -n "$SCOPUS_API_KEY" ]; then
            python scripts/harvest_scopus.py || true
          else
            echo "Scopus harvester or key is not configured; skipping."
          fi
      - name: Generate derived public data
        run: |
          if [ -f scripts/build_public_data.py ]; then
            python scripts/build_public_data.py || true
          else
            echo "No public data builder yet; skipping."
          fi
      - name: Write refresh audit stamp
        run: |
          mkdir -p data/audit
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/audit/last_refresh_utc.txt
      - name: Commit data and mirrored assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ assets/craftum/ || true
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh portfolio data and assets"
            git push
          fi
