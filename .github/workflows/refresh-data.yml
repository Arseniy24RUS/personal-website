name: Refresh scientist portfolio data

on:
  workflow_dispatch:
    inputs:
      scopus_author_id:
        description: "Optional Scopus Author ID override"
        required: false
        default: "57220956828"
        type: string
      mirror_craftum_assets:
        description: "Download/mirror Craftum assets into repository"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: "17 3 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyyaml rapidfuzz
      - name: Mirror Craftum assets
        run: |
          if [ "${{ inputs.mirror_craftum_assets || 'true' }}" = "true" ] && [ -f scripts/mirror_craftum_assets.py ]; then
            python scripts/mirror_craftum_assets.py || true
          else
            echo "Craftum asset mirroring skipped."
          fi
      - name: Parse saved eLibrary snapshots
        run: |
          mkdir -p data/processed
          if [ -d data/snapshots/elibrary ] && [ -f scripts/parse_elibrary_author_items.py ]; then
            latest=$(find data/snapshots/elibrary -name "*.html" | sort | tail -n 1)
            if [ -n "$latest" ]; then
              python scripts/parse_elibrary_author_items.py "$latest" --out data/processed/elibrary_publications.json
            else
              echo "No eLibrary HTML snapshots found."
            fi
          else
            echo "No eLibrary snapshots directory or parser script; using existing data/elibrary/publications.tsv."
          fi
      - name: Harvest Scopus
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INST_TOKEN: ${{ secrets.SCOPUS_INST_TOKEN }}
          SCOPUS_AUTHOR_ID: ${{ inputs.scopus_author_id || '57220956828' }}
          SCOPUS_OUT_DIR: data/scopus
        run: |
          if [ -f scripts/harvest_scopus.py ] && [ -n "$SCOPUS_API_KEY" ]; then
            python scripts/harvest_scopus.py || true
          else
            echo "Scopus harvester or key is not configured; skipping."
          fi
      - name: Commit data and mirrored assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ assets/craftum/ || true
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh portfolio data and assets"
            git push
          fi
