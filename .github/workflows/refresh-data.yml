name: Refresh scientist portfolio data
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate collection without publishing
        type: boolean
        default: false
      sources:
        description: Comma-separated sources, empty for all
        type: string
        default: ''
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
      sources:
        type: string
        default: ''
  schedule:
    - cron: '17 3 * * 1'
concurrency:
  group: portfolio-data-writer
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  actions: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: '1'
  PLAYWRIGHT_BROWSERS_PATH: /opt/portfolio-browsers
  PORTFOLIO_RUN_DIR: /opt/portfolio-runner
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openvpn curl iproute2 xvfb iptables
          python -m pip install -r requirements.txt
          npm ci
          sudo mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          sudo chown "$USER" "$PLAYWRIGHT_BROWSERS_PATH"
          sudo install -d -o "$USER" -g "$(id -gn)" -m 755 "$PORTFOLIO_RUN_DIR"
          python -m playwright install --with-deps chromium
          npx playwright install --with-deps
      - name: Unit and baseline checks
        run: |
          python -m unittest discover -s tests/unit -v
          python scripts/check_seo.py
          echo "REFRESH_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Load profile identifiers
        run: python scripts/export_profile_env.py
      - name: Prepare isolated candidate
        run: python scripts/refresh_pipeline.py prepare --stage "$PORTFOLIO_RUN_DIR/portfolio-stage"
      - name: Establish verified home route
        env:
          ELIBRARY_OPENVPN_CONFIG_B64: ${{ secrets.ELIBRARY_OPENVPN_CONFIG_B64 }}
        run: |
          chmod +x scripts/home_vpn_dns.sh
          bash scripts/home_vpn.sh start
          bash scripts/home_vpn.sh test-isolation
          sudo chown -R portfolio:portfolio "$PORTFOLIO_RUN_DIR/portfolio-stage"
          sudo install -d -o portfolio -g portfolio -m 700 "$PORTFOLIO_RUN_DIR/portfolio-runtime"
      - name: Collect and build candidate through home route
        env:
          HOME_VPN_REQUIRED: '1'
          HOME_VPN_EXPECTED_IP_FILE: /opt/portfolio-runner/portfolio-private/expected-ip
          ELIBRARY_USERNAME: ${{ secrets.ELIBRARY_USERNAME }}
          ELIBRARY_PASSWORD: ${{ secrets.ELIBRARY_PASSWORD }}
          WOS_ORCID_USERNAME: ${{ secrets.WOS_ORCID_USERNAME }}
          WOS_ORCID_PASSWORD: ${{ secrets.WOS_ORCID_PASSWORD }}
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INST_TOKEN: ${{ secrets.SCOPUS_INST_TOKEN }}
          OPENALEX_MAILTO: omnistat@yandex.ru
          CROSSREF_MAILTO: omnistat@yandex.ru
          ELIBRARY_BROWSER_HEADLESS: 'false'
          WOS_BROWSER_HEADLESS: 'false'
          REFRESH_SOURCES: ${{ inputs.sources }}
        run: |
          bash scripts/home_vpn.sh check
          stage="$PORTFOLIO_RUN_DIR/portfolio-stage"
          export RUNNER_TEMP="$PORTFOLIO_RUN_DIR/portfolio-runtime"
          sudo --preserve-env=PATH,RUNNER_TEMP,PLAYWRIGHT_BROWSERS_PATH,PYTHONUNBUFFERED,HOME_VPN_REQUIRED,HOME_VPN_EXPECTED_IP_FILE,ELIBRARY_USERNAME,ELIBRARY_PASSWORD,WOS_ORCID_USERNAME,WOS_ORCID_PASSWORD,SCOPUS_API_KEY,SCOPUS_INST_TOKEN,OPENALEX_MAILTO,CROSSREF_MAILTO,ELIBRARY_AUTHOR_ID,ELIBRARY_PROFILE_URL,ELIBRARY_ITEMS_URL,ELIBRARY_SPIN,ORCID_ID,SCOPUS_AUTHOR_ID,WOS_RESEARCHER_ID,WOS_PROFILE_URL,ELIBRARY_BROWSER_HEADLESS,WOS_BROWSER_HEADLESS \
            -H -u portfolio /bin/bash "$stage/scripts/run_collection.sh" "$stage" "$(command -v python)" "$REFRESH_SOURCES"
      - name: Return candidate ownership to runner
        if: always()
        run: |
          if test -d "$PORTFOLIO_RUN_DIR/portfolio-stage"; then
            sudo chown -R "$(id -u):$(id -g)" "$PORTFOLIO_RUN_DIR/portfolio-stage"
          fi
      - name: Export safe collection diagnostics
        if: always()
        run: python scripts/refresh_pipeline.py diagnostics --stage "$PORTFOLIO_RUN_DIR/portfolio-stage" --output "$RUNNER_TEMP/refresh-diagnostics"
      - name: Stop tunnel and remove private state
        if: always()
        run: bash scripts/home_vpn.sh stop
      - name: Promote and validate safe candidate
        run: |
          python scripts/refresh_pipeline.py promote --stage "$PORTFOLIO_RUN_DIR/portfolio-stage"
          python scripts/validate_retention.py --baseline-ref "$REFRESH_BASE_SHA" --report data/audit/retention_report.json
          python scripts/check_seo.py
          git diff --check
      - name: Browser checks on refreshed data
        run: npm run test:e2e
      - name: Save sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/refresh-diagnostics/data/
          retention-days: 7
      - name: Commit validated data
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        id: publish
        run: python scripts/publish_refresh.py --baseline-ref "$REFRESH_BASE_SHA"
      - name: Request Pages build
        if: ${{ steps.publish.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
      - name: Verify published data
        if: ${{ steps.publish.outputs.changed == 'true' }}
        run: python scripts/verify_published.py --wait 600
      - name: Report source availability separately
        if: ${{ always() && !cancelled() }}
        run: python scripts/refresh_pipeline.py health --stage "$PORTFOLIO_RUN_DIR/portfolio-stage"
