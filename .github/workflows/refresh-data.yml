name: Refresh scientist portfolio data

on:
  workflow_dispatch:
    inputs:
      scopus_author_id:
        description: "Optional Scopus Author ID override"
        required: false
        default: "57220956828"
        type: string
  schedule:
    - cron: "17 3 * * 1"

# GitHub will switch JavaScript actions from Node.js 20 to Node.js 24 by default.
# Opt in now to remove the Node.js 20 deprecation warning and surface compatibility problems early.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyyaml rapidfuzz
      - name: Parse saved eLibrary snapshots
        run: |
          echo "eLibrary parsing will run after parser script is committed."
      - name: Harvest Scopus
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INST_TOKEN: ${{ secrets.SCOPUS_INST_TOKEN }}
          SCOPUS_AUTHOR_ID: ${{ inputs.scopus_author_id || '57220956828' }}
          SCOPUS_OUT_DIR: data/scopus
        run: |
          if [ -f scripts/harvest_scopus.py ] && [ -n "$SCOPUS_API_KEY" ]; then
            python scripts/harvest_scopus.py || true
          else
            echo "Scopus harvester or key is not configured; skipping."
          fi
      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh portfolio data"
            git push
          fi
